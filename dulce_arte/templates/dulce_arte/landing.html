<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulce Arte – Acceso</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2118;
            font-family: Georgia, "Times New Roman", serif;
            color: #f8f1e9;
        }
        .box {
            text-align: center;
            max-width: 420px;
            padding: 2.5rem 1.5rem;
        }
        .brand {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.6rem;
        }
        .accent-line {
            width: 48px;
            height: 3px;
            background: #a35c2a;
            margin: 0 auto 1.4rem;
        }
        p {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #c4b5a5;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background: #f8f1e9;
            color: #2a2118;
            padding: 0.7rem 1.6rem;
            border-radius: 7px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .btn:hover { background: #e8d9c8; }
    </style>
</head>
<body>
    <div class="box">
        <div class="brand">Dulce Arte</div>
        <div class="accent-line"></div>
        <p>Sistema de trazabilidad y gestión de pedidos para pastelería artesanal.<br>Acceso exclusivo para personal autorizado.</p>
        <a href="{% url 'login' %}" class="btn">Ingresar al sistema</a>
    </div>
</body>
</html>
